<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pixel Ninja">
  <!-- Rounded dark background -->
  <rect width="64" height="64" rx="14" fill="#0E0E12"/>

  <!-- Katana behind the head (over the shoulder) -->
  <g transform="rotate(-28 32 32)">
    <!-- blade -->
    <rect x="6" y="57.6" width="36" height="1.8" rx="0.9" fill="#E6E8EE"/>
    <!-- blade edge highlight -->
    <rect x="6" y="57.4" width="36" height="0.5" fill="#FFFFFF" opacity="0.5"/>
    <!-- tsuba (guard) -->
    <rect x="42" y="56" width="1.8" height="5" rx="0.4" fill="#1A1A1F"/>
    <!-- tsuka (hilt) with wrap -->
    <rect x="43.8" y="57.6" width="8" height="1.8" rx="0.6" fill="#8F2A2A"/>
    <rect x="44.4" y="57.8" width="0.8" height="1.4" fill="#1A1A1F"/>
    <rect x="46" y="57.8" width="0.8" height="1.4" fill="#1A1A1F"/>
    <rect x="47.6" y="57.8" width="0.8" height="1.4" fill="#1A1A1F"/>
    <rect x="49.2" y="57.8" width="0.8" height="1.4" fill="#1A1A1F"/>
    <!-- kashira (pommel cap) -->
    <rect x="51.8" y="57.4" width="1.4" height="2.2" rx="0.3" fill="#1A1A1F"/>
  </g>

  <!-- Ninja hooded head silhouette -->
  <path d="M32 9
           C 20 9, 15 18, 16 30
           C 16 37, 18 43, 21 48
           C 23 52, 27 54, 32 54
           C 37 54, 41 52, 43 48
           C 46 43, 48 37, 48 30
           C 49 18, 44 9, 32 9 Z"
        fill="#17171C"/>

  <!-- Hood seam highlight -->
  <path d="M32 9 C 44 9, 49 18, 48 30 C 48 37, 46 43, 43 48"
        fill="none" stroke="#2A2A33" stroke-width="0.8" opacity="0.8"/>

  <!-- Mask band (brand accent) -->
  <path d="M14 27 L 50 27 L 50 35 L 14 35 Z" fill="#E24B3A"/>
  <path d="M14 27 L 50 27 L 50 29 L 14 29 Z" fill="#FF6B5A" opacity="0.45"/>

  <!-- Bandana knot tail on the left -->
  <path d="M2 22 L 14 29 L 14 33 L 2 41 Z" fill="#E24B3A"/>
  <path d="M4 26 L 11 30 L 11 32 L 4 37 Z" fill="#B83529" opacity="0.55"/>

  <!-- Eye slits -->
  <rect x="22" y="30" width="6.5" height="2.6" rx="1" fill="#F4F1E8"/>
  <rect x="35.5" y="30" width="6.5" height="2.6" rx="1" fill="#F4F1E8"/>
</svg>
