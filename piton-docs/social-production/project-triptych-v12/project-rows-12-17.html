    if(face){for(let i=0;i<76;i++){const dot=document.createElement('i');dot.className='face-dot';const angle=(i/76)*Math.PI*2;const ring=i%3;const rx=92-ring*17,ry=142-ring*25;dot.style.left=(132+Math.cos(angle)*rx)+'px';dot.style.top=(170+Math.sin(angle)*ry)+'px';face.appendChild(dot)}}
  </script>
</body>
